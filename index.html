<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Sudoku Solver</title>
    <!-- Tesseract.js for Optical Character Recognition (OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --solved-color: #4ade80;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        /* Upload / Camera Buttons */
        .upload-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--accent);
            color: #0f172a;
            border: none;
            width: 100%;
            font-size: 1.05rem;
            padding: 14px;
            margin-top: 16px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            color: white;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            width: 100%;
            margin-top: 10px;
        }

        input[type="file"] {
            display: none;
        }

        /* Status & Progress */
        #status {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 12px;
            min-height: 20px;
        }

        /* Sudoku Grid */
        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            border: 3px solid var(--accent);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.8);
            aspect-ratio: 1 / 1;
            width: 100%;
            margin: 0 auto;
        }

        .cell {
            width: 100%;
            height: 100%;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            outline: none;
            transition: background 0.2s;
        }

        .cell:focus {
            background: rgba(56, 189, 248, 0.25);
        }

        /* Thick 3x3 Subgrid Borders */
        .cell:nth-child(3n) {
            border-right: 2px solid var(--accent);
        }
        .cell:nth-child(9n) {
            border-right: none;
        }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid var(--accent);
        }

        .cell.solved {
            color: var(--solved-color);
            font-weight: 700;
            animation: popIn 0.3s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Hidden canvas for image processing */
        #processCanvas {
            display: none;
        }

        .tip {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Vision Sudoku Solver</h1>
    <p class="subtitle">Snap a photo or upload a cropped Sudoku grid</p>

    <div class="upload-group">
        <!-- Opens Camera directly on mobile devices -->
        <label class="btn">
            📷 Take Photo
            <input type="file" id="cameraInput" accept="image/*" capture="environment">
        </label>
        <!-- Opens Gallery / File Picker -->
        <label class="btn">
            🖼️ Gallery
            <input type="file" id="galleryInput" accept="image/*">
        </label>
    </div>

    <div id="status">Ready. Upload an image or type numbers manually.</div>

    <div class="sudoku-board" id="board"></div>

    <button class="btn btn-primary" onclick="handleSolve()">✨ Solve Puzzle</button>
    <button class="btn btn-secondary" onclick="clearBoard()">Clear Grid</button>

    <p class="tip">💡 <b>Pro Tip:</b> For the best AI scan accuracy, crop your photo tightly around the 9×9 outer border of the Sudoku puzzle before uploading. You can tap any cell to fix misread digits.</p>
</div>

<canvas id="processCanvas"></canvas>

<script>
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    const cells = [];

    // 1. Initialize the 9x9 UI Grid
    function initBoard() {
        boardElement.innerHTML = '';
        cells.length = 0;
        for (let i = 0; i < 81; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'numeric';
            input.maxLength = 1;
            input.className = 'cell';
            
            // Allow only digits 1-9
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^1-9]/g, '');
                e.target.classList.remove('solved');
            });

            boardElement.appendChild(input);
            cells.push(input);
        }
    }

    initBoard();

    // 2. Handle Image Upload (Camera & Gallery)
    document.getElementById('cameraInput').addEventListener('change', processImageUpload);
    document.getElementById('galleryInput').addEventListener('change', processImageUpload);

    function processImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        statusElement.innerText = "⏳ Processing image & scanning digits...";
        clearBoard();

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                scanGridWithOCR(img);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // 3. Slice Image into 81 Cells & Run OCR
    async function scanGridWithOCR(img) {
        const canvas = document.getElementById('processCanvas');
        const ctx = canvas.getContext('2d');
        
        // Normalize image size to a clean square
        const size = 900; 
        canvas.width = size;
        canvas.height = size;
        ctx.drawImage(img, 0, 0, size, size);

        // Convert to high-contrast grayscale to help Tesseract read cleanly
        const imgData = ctx.getImageData(0, 0, size, size);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            const threshold = avg > 140 ? 255 : 0; // Binarize
            data[i] = data[i + 1] = data[i + 2] = threshold;
        }
        ctx.putImageData(imgData, 0, 0);

        const cellSize = size / 9;
        const padding = 14; // Crop out grid border lines inside each cell

        try {
            const worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
                tessedit_char_whitelist: '123456789',
                tessedit_pageseg_mode: Tesseract.PSM.SINGLE_CHAR,
            });

            const cellCanvas = document.createElement('canvas');
            cellCanvas.width = cellSize - padding * 2;
            cellCanvas.height = cellSize - padding * 2;
            const cellCtx = cellCanvas.getContext('2d');

            for (let row = 0; row < 9; row++) {
                statusElement.innerText = `🔍 Scanning row ${row + 1} of 9...`;
                for (let col = 0; col < 9; col++) {
                    // Extract individual cell without border lines
                    cellCtx.drawImage(
                        canvas,
                        col * cellSize + padding,
                        row * cellSize + padding,
                        cellSize - padding * 2,
                        cellSize - padding * 2,
                        0, 0,
                        cellCanvas.width,
                        cellCanvas.height
                    );

                    // Check if cell is mostly white (empty) to skip unnecessary OCR
                    if (isCellEmpty(cellCtx, cellCanvas.width, cellCanvas.height)) {
                        continue;
                    }

                    const { data: { text } } = await worker.recognize(cellCanvas);
                    const digit = text.trim().replace(/[^1-9]/g, '');
                    if (digit.length === 1) {
                        cells[row * 9 + col].value = digit;
                    }
                }
            }

            await worker.terminate();
            statusElement.innerText = "✅ Scan complete! Review any misread cells and click Solve.";
        } catch (err) {
            console.error(err);
            statusElement.innerText = "❌ Error scanning image. Try cropping closer to the grid.";
        }
    }

    // Helper: Detect if a cell has enough dark pixels to contain a number
    function isCellEmpty(ctx, w, h) {
        const pixels = ctx.getImageData(0, 0, w, h).data;
        let darkPixels = 0;
        for (let i = 0; i < pixels.length; i += 4) {
            if (pixels[i] === 0) darkPixels++;
        }
        // If less than 3% of the cell is black, assume it's empty
        return (darkPixels / (w * h)) < 0.03;
    }

    // 4. Backtracking Sudoku Solver Algorithm
    function handleSolve() {
        const grid = [];
        for (let r = 0; r < 9; r++) {
            const row = [];
            for (let c = 0; c < 9; c++) {
                const val = parseInt(cells[r * 9 + c].value) || 0;
                row.push(val);
            }
            grid.push(row);
        }

        if (!isValidInitialBoard(grid)) {
            statusElement.innerText = "⚠️ Invalid puzzle! Duplicate numbers detected in row, column, or box.";
            return;
        }

        if (solveSudoku(grid)) {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const index = r * 9 + c;
                    if (cells[index].value === '') {
                        cells[index].value = grid[r][c];
                        cells[index].classList.add('solved');
                    }
                }
            }
            statusElement.innerText = "🎉 Sudoku Solved!";
        } else {
            statusElement.innerText = "❌ No solution exists for this configuration.";
        }
    }

    function isValidInitialBoard(board) {
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const num = board[r][c];
                if (num !== 0) {
                    board[r][c] = 0;
                    if (!isSafe(board, r, c, num)) {
                        board[r][c] = num;
                        return false;
                    }
                    board[r][c] = num;
                }
            }
        }
        return true;
    }

    function isSafe(board, row, col, num) {
        for (let x = 0; x < 9; x++) {
            if (board[row][x] === num || board[x][col] === num) return false;
        }
        const startRow = row - (row % 3);
        const startCol = col - (col % 3);
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                if (board[i + startRow][j + startCol] === num) return false;
            }
        }
        return true;
    }

    function solveSudoku(board) {
        for (let row = 0; row < 9; row++) {
            for (let col = 0; col < 9; col++) {
                if (board[row][col] === 0) {
                    for (let num = 1; num <= 9; num++) {
                        if (isSafe(board, row, col, num)) {
                            board[row][col] = num;
                            if (solveSudoku(board)) return true;
                            board[row][col] = 0;
                        }
                    }
                    return false;
                }
            }
        }
        return true;
    }

    function clearBoard() {
        cells.forEach(cell => {
            cell.value = '';
            cell.classList.remove('solved');
        });
        statusElement.innerText = "Board cleared.";
    }
</script>

</body>
</html>
